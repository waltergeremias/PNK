apiVersion: v1
kind: Secret
metadata:
  name: keda-azdo-secret-{{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  organizationURL: {{ .Values.pnk.organization_name | b64enc | quote }}
  personalAccessToken: {{ .Values.pnk.pat | b64enc | quote  }}

---
apiVersion: v1
kind: Secret
metadata:
  name: mi-acr-{{ .Release.Name }}
  namespace: kube-system
type: Opaque
data:
 # Values must be Base64-encoded
  username: {{ .Values.pnk.acr_name | b64enc | quote }}
  password: {{ .Values.pnk.acr_pass | b64enc | quote  }}
